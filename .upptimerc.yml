# Проверки доступности SVOI. Описание — docs/MONITORING.md в репозитории family-hub.
owner: kirilltrofim
repo: svoi-status

# Проверки идут с серверов GitHub каждые 5 минут — снаружи, а не с нашего сервера.
sites:
  - name: Сайт
    url: https://svoihub.ru/
  - name: Веб-приложение
    url: https://svoihub.ru/app/
  - name: API
    url: https://api.svoihub.ru/health
    maxResponseTime: 5000
  - name: Telegram-посредник
    url: https://tg.svoihub.ru/oauth/.well-known/openid-configuration

assignees:
  - kirilltrofim

status-website:
  baseUrl: /svoi-status
  logoUrl: https://raw.githubusercontent.com/kirilltrofim/svoi-status/master/assets/apple-touch-icon.png
  favicon: https://raw.githubusercontent.com/kirilltrofim/svoi-status/master/assets/apple-touch-icon.png
  name: SVOI — статус
  introTitle: "**SVOI**: работают ли сайт, приложение и сервер"
  introMessage: Проверка снаружи каждые 5 минут.
  theme: light
  navbar:
    - title: Статус
      href: /
    - title: Сайт SVOI
      href: https://svoihub.ru/

